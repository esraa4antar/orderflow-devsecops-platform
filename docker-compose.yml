services:
  db:
    image: postgres:16-alpine
    container_name: orderflow-db

    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./app/backend

    container_name: orderflow-backend-compose

    ports:
      - "8000:8000"

    depends_on:
      - db

    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

volumes:
  postgres_data:
